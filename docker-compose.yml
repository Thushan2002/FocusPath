name: focuspath

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: focuspath
      POSTGRES_PASSWORD: focuspath
      POSTGRES_DB: focuspath
    # 5433 on the host so it doesn't clash with a locally installed Postgres.
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U focuspath"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Dev mail catcher: SMTP on 1025, web UI on http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  pgdata:
